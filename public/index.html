<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Dashboard</title>
</head>

<body>
    <h1 id="heading">Billing Software</h1>
    <p id="time">Get Current Time:
        <button id="test-btn">Click Me</button>
    </p>
    <script>
        const btn = document.querySelector("#test-btn")
        btn.addEventListener("click", () => {
            const headingContent = document.querySelector("#time")
            const content = new Date().toLocaleString(
                "en-IN",
                {
                    "timeZone": "Asia/Kolkata",
                    "timeZoneName": "short"
                }
            );
            headingContent.textContent = "Current Time is:" + content
        })
    </script>
</body>

</html>
